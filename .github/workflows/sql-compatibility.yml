name: SQL compatibility tests

on:
  workflow_dispatch:
    inputs:
      stack_a_release_tag:
        description: 'Reviewed release in this repository containing the original stack-a.zip'
        required: true
        type: string
      stack_a_sha256:
        description: 'Reviewed SHA-256 of stack-a.zip (not the enclosing GitHub artifact)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  sql-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STACK_A_COMPATIBILITY_SHA256: ${{ inputs.stack_a_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate reviewed inputs
        env:
          BASELINE_TAG: ${{ inputs.stack_a_release_tag }}
        run: |
          set -euo pipefail
          [[ "$BASELINE_TAG" != -* ]]
          git check-ref-format "refs/tags/$BASELINE_TAG"
          [[ "$STACK_A_COMPATIBILITY_SHA256" =~ ^[a-fA-F0-9]{64}$ ]]
          echo "STACK_A_COMPATIBILITY_ARCHIVE=$RUNNER_TEMP/stack-a-baseline/stack-a.zip" >> "$GITHUB_ENV"

      - name: Download reviewed baseline
        env:
          BASELINE_TAG: ${{ inputs.stack_a_release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$BASELINE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern stack-a.zip --dir "$RUNNER_TEMP/stack-a-baseline"

      - name: Verify package checksum
        run: |
          set -euo pipefail
          actual="$(sha256sum "$STACK_A_COMPATIBILITY_ARCHIVE" | cut -d ' ' -f 1)"
          [[ "${actual,,}" == "${STACK_A_COMPATIBILITY_SHA256,,}" ]]

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore and audit test dependencies
        run: dotnet restore dotnet/tests/Infrastructure.Tests/TalentMatch.Infrastructure.Tests.csproj

      - name: Start disposable SQL Server
        id: sql
        run: |
          set -euo pipefail
          MSSQL_SA_PASSWORD="Tm!$(openssl rand -hex 24)"
          export MSSQL_SA_PASSWORD
          echo "::add-mask::$MSSQL_SA_PASSWORD"
          connection="Server=127.0.0.1,1433;Database=master;User Id=sa;Password=$MSSQL_SA_PASSWORD;Encrypt=False;TrustServerCertificate=True;Connect Timeout=30"
          echo "::add-mask::$connection"
          echo "BULK_SCORING_TEST_SQLSERVER=$connection" >> "$GITHUB_ENV"
          container="$(docker create --memory 3g --cpus 2 \
            -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e MSSQL_SA_PASSWORD \
            -e MSSQL_MEMORY_LIMIT_MB=2048 -p 127.0.0.1:1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest)"
          echo "container=$container" >> "$GITHUB_OUTPUT"
          docker start "$container"
          for attempt in {1..60}; do
            if docker exec "$container" sh -c \
              'SQLCMDPASSWORD="$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -l 5 -b -Q "SELECT 1"' \
              >/dev/null 2>&1; then
              exit 0
            fi
            [[ "$(docker inspect --format '{{.State.Running}}' "$container")" == true ]] || break
            sleep 2
          done
          echo "::error::SQL Server did not become ready."
          exit 1

      - name: Run real SQL Server and mixed-version tests
        run: |
          dotnet test dotnet/tests/Infrastructure.Tests/TalentMatch.Infrastructure.Tests.csproj \
            --configuration Release --no-restore --maxcpucount:1 \
            --filter FullyQualifiedName~BulkScoringSqlServerConcurrencyTests \
            --logger "trx;LogFileName=sql-compatibility.trx" \
            --results-directory TestResults/sql-compatibility

      - name: Require executed tests and mixed-version proof
        shell: pwsh
        run: |
          [xml]$result = Get-Content -LiteralPath 'TestResults/sql-compatibility/sql-compatibility.trx' -Raw
          $namespaces = [System.Xml.XmlNamespaceManager]::new($result.NameTable)
          $namespaces.AddNamespace('t', $result.DocumentElement.NamespaceURI)
          $tests = $result.SelectNodes('//t:UnitTestResult', $namespaces)
          if ($tests.Count -eq 0 -or @($tests | Where-Object outcome -ne 'Passed').Count -ne 0) {
            throw 'SQL compatibility tests failed or were skipped.'
          }
          $mixed = @($tests | Where-Object testName -like '*Archived_stack_a_survives_stack_b_shared_schema_initialization*')
          if ($mixed.Count -ne 1 -or $mixed[0].outcome -ne 'Passed') {
            throw 'Required mixed-version SQL Server proof is missing.'
          }

      - name: Remove disposable SQL Server
        if: ${{ always() && steps.sql.outputs.container != '' }}
        env:
          SQL_CONTAINER: ${{ steps.sql.outputs.container }}
        run: docker rm --force "$SQL_CONTAINER"

      - name: Upload test results only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sql-compatibility-results
          path: TestResults/sql-compatibility/*.trx
          if-no-files-found: warn
          retention-days: 7
